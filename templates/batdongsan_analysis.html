                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-16 py-8">
                        {/* Section 1: Cause-Effect */}
                        <section id="cause-effect" className="space-y-8">
                            <div className="space-y-2">
                                <span className="px-3 py-1 rounded-md text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30">1. KHUNG TƯ DUY NGUYÊN NHÂN - KẾT QUẢ</span>
                                <h2 className="text-2xl sm:text-3xl font-black text-slate-100">Bảng Ma Trận Nhân - Quả Chi Phối Thị Trường BĐS</h2>
                            </div>

                            <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col md:flex-row gap-4 justify-between">
                                <input
                                    type="text"
                                    placeholder="Tìm kiếm tác động (Lãi suất, Tỷ giá, Đòn bẩy...)..."
                                    value={searchTerm}
                                    onChange={e => setSearchTerm(e.target.value)}
                                    className="px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-slate-100 flex-1 text-base focus:outline-none focus:border-amber-500"
                                />
                                <div className="flex gap-2">
                                    {['all', 'increase', 'decrease', 'freeze'].map(type => (
                                        <button
                                            key={type}
                                            onClick={() => setSelectedImpact(type)}
                                            className={`px-4 py-2 rounded-xl font-bold text-sm ${selectedImpact === type ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}
                                        >
                                            {type === 'all' ? 'Tất cả' : type === 'increase' ? 'Tăng giá ⬆️' : type === 'decrease' ? 'Giảm giá ⬇️' : 'Đóng băng ❄️'}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {filteredCE.map(item => (
                                    <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 shadow-lg">
                                        <div className="flex justify-between items-center">
                                            <span className="text-xs font-bold uppercase bg-slate-800 text-slate-400 px-3 py-1 rounded-md">{item.impactGroup}</span>
                                            <span className={`text-xs font-extrabold px-3 py-1 rounded-full ${item.impactType === 'increase' ? 'bg-emerald-500/20 text-emerald-400' : item.impactType === 'decrease' ? 'bg-rose-500/20 text-rose-400' : 'bg-cyan-500/20 text-cyan-400'}`}>
                                                {item.impactType === 'increase' ? 'Tăng giá ⬆️' : item.impactType === 'decrease' ? 'Giảm giá ⬇️' : 'Đóng băng ❄️'}
                                            </span>
                                        </div>
                                        <h3 className="text-lg font-bold text-slate-100">⚡ {item.cause}</h3>
                                        <div className="p-3.5 bg-slate-950 rounded-xl border border-slate-800 text-amber-400 font-bold text-base">🎯 {item.effect}</div>
                                        <p className="text-slate-300 text-base leading-relaxed">{item.detail}</p>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* Section 2: Factor Tabs */}
                        <section id="factors" className="space-y-8">
                            <div className="space-y-2">
                                <span className="px-3 py-1 rounded-md text-xs font-bold bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">2. 4 TRỤ CỘT ẢNH HƯỞNG VĨ MÔ</span>
                                <h2 className="text-2xl sm:text-3xl font-black text-slate-100">Phân Tích Chi Tiết 4 Nhóm Yếu Tố Ảnh Hưởng</h2>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                {FACTOR_TABS_DATA.map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTabId(tab.id)}
                                        className={`p-4 rounded-xl font-extrabold text-base transition-all ${activeTabId === tab.id ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-slate-300 hover:bg-slate-800'}`}
                                    >
                                        {tab.title}
                                    </button>
                                ))}
                            </div>

                            <div className="space-y-6">
                                {activeFactorGroup.factors.map((f, idx) => (
                                    <div key={idx} className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                                        <h4 className="text-xl font-bold text-slate-100">{f.name}</h4>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div className="p-5 bg-emerald-950/20 border border-emerald-800/40 rounded-xl space-y-2">
                                                <div className="text-emerald-400 font-bold text-sm">KỊCH BẢN TÍCH CỰC: {f.bullScenario}</div>
                                                <p className="text-slate-300 text-base">{f.bullImpact}</p>
                                            </div>
                                            <div className="p-5 bg-rose-950/20 border border-rose-800/40 rounded-xl space-y-2">
                                                <div className="text-rose-400 font-bold text-sm">KỊCH BẢN TIÊU CỰC: {f.bearScenario}</div>
                                                <p className="text-slate-300 text-base">{f.bearImpact}</p>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* Section 3: Segment Cards */}
                        <section id="segments" className="space-y-8">
                            <div className="space-y-2">
                                <span className="px-3 py-1 rounded-md text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">3. PHÂN TÍCH PHÂN KHÚC</span>
                                <h2 className="text-2xl sm:text-3xl font-black text-slate-100">Đặc Tính Vận Hành 4 Phân Khúc BĐS Cốt Lõi</h2>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                {SEGMENTS_DATA.map(seg => (
                                    <div key={seg.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                                        <div className="flex justify-between items-start border-b border-slate-800 pb-3">
                                            <div>
                                                <h3 className="text-xl font-extrabold text-slate-100">{seg.title}</h3>
                                                <p className="text-sm text-slate-400">{seg.subtitle}</p>
                                            </div>
                                            <span className="px-3 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-400">Rủi ro: {seg.riskLevel}</span>
                                        </div>
                                        <div className="p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl text-amber-300 font-bold text-sm">⚡ {seg.sensitivity}</div>
                                        <p className="text-slate-300 text-base">{seg.summary}</p>
                                        <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl text-emerald-400 font-medium text-sm">💡 LỜI KHUYÊN: {seg.strategicAdvice}</div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* Section 4: Formula & Principles */}
                        <section id="principles" className="space-y-8">
                            <div className="space-y-2">
                                <span className="px-3 py-1 rounded-md text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30">4. ĐỊNH GIÁ & THỰC CHIẾN</span>
                                <h2 className="text-2xl sm:text-3xl font-black text-slate-100">Công Thức Định Giá & 4 Nguyên Tắc Vàng</h2>
                            </div>

                            <div className="p-8 bg-slate-900 border border-amber-500/40 rounded-3xl text-center space-y-4">
                                <div className="text-xs font-extrabold text-slate-400 uppercase tracking-widest">CÔNG THỨC ĐỊNH GIÁ CỐT LÕI</div>
                                <div className="text-xl sm:text-3xl font-black text-amber-300 font-mono">GIÁ BĐS = GIÁ TRỊ SỬ DỤNG + KỲ VỌNG TƯƠNG LAI + CHI PHÍ TÀI CHÍNH</div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {FORMULA_PRINCIPLES_DATA.map(pr => (
                                    <div key={pr.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-3">
                                        <h4 className="text-lg font-bold text-amber-400">{pr.title}</h4>
                                        <p className="text-slate-300 text-base">{pr.description}</p>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* Section 5: Global Risk */}
                        <section id="global-risk" className="space-y-8">
                            <div className="space-y-2">
                                <span className="px-3 py-1 rounded-md text-xs font-bold bg-rose-500/10 text-rose-400 border border-rose-500/30">5. KHỦNG HOẢNG KINH TẾ TOÀN CẦU</span>
                                <h2 className="text-2xl sm:text-3xl font-black text-slate-100">🌍 6 Khối Phân Tích Dấu Hiệu Khủng Hoảng Toàn Cầu</h2>
                            </div>

                            <div className="p-6 bg-rose-950/30 border border-rose-800/50 rounded-2xl space-y-2">
                                <h3 className="text-lg font-bold text-rose-400">{GLOBAL_CRISIS_DATA.principleBanner.title}</h3>
                                <p className="text-slate-200 text-base">{GLOBAL_CRISIS_DATA.principleBanner.description}</p>
                            </div>

                            <div className="bg-slate-900 p-6 border border-slate-800 rounded-2xl space-y-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-xl font-bold text-slate-100">7.6 Checklist Dấu Hiệu Báo Động</h3>
                                    <button onClick={resetChecklist} className="px-3 py-1.5 bg-slate-800 text-slate-300 text-xs font-bold rounded-lg">Khôi phục</button>
                                </div>
                                <div className="text-sm text-amber-400 font-bold">Cảnh báo: {checkedCount} / {checklist.length} tín hiệu ({riskPct}%)</div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    {checklist.map(c => (
                                        <div key={c.id} onClick={() => toggleCheck(c.id)} className={`p-4 rounded-xl border cursor-pointer ${c.checked ? 'bg-amber-950/40 border-amber-500 text-slate-100 font-semibold' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>
                                            {c.checked ? '☑ ' : '☐ '} {c.label}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* Section 6: Live Monitor */}
                        <section id="live-monitor" className="space-y-8">
                            <div className="space-y-2">
                                <span className="px-3 py-1 rounded-md text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">6. BẢNG THEO DÕI THỰC TẾ</span>
                                <h2 className="text-2xl sm:text-3xl font-black text-slate-100">Live Monitor — Theo Dõi Chỉ Số Thị Trường</h2>
                            </div>

                            {toastMsg && <div className="p-4 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-bold rounded-xl">{toastMsg}</div>}

                            <div className="flex gap-3 justify-end">
                                <button onClick={exportCSV} className="px-4 py-2.5 bg-cyan-600 text-white font-bold text-sm rounded-xl">Xuất CSV 📥</button>
                                <button onClick={() => saveMetrics(INITIAL_MONITOR_METRICS)} className="px-4 py-2.5 bg-slate-800 text-slate-300 font-bold text-sm rounded-xl">Khôi phục</button>
                            </div>

                            <div className="overflow-x-auto bg-slate-900 border border-slate-800 rounded-2xl">
                                <table className="w-full text-left min-w-[800px]">
                                    <thead>
                                        <tr className="bg-slate-950 text-slate-400 text-xs font-bold uppercase border-b border-slate-800">
                                            <th className="p-4">Chỉ số</th>
                                            <th className="p-4">Giá trị</th>
                                            <th className="p-4">Xu hướng</th>
                                            <th className="p-4">Rủi ro</th>
                                            <th className="p-4">Kết luận vĩ mô</th>
                                            <th className="p-4">Gợi ý hành động</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800 text-sm">
                                        {metrics.map(m => (
                                            <tr key={m.id} className="hover:bg-slate-800/40">
                                                <td className="p-4 font-bold text-slate-100">{m.name}</td>
                                                <td className="p-4 font-bold text-amber-300 font-mono">{m.currentValue}</td>
                                                <td className="p-4 font-bold">{m.trend === 'up' ? 'Tăng ⬆️' : m.trend === 'down' ? 'Giảm ⬇️' : 'Đi ngang ➡️'}</td>
                                                <td className="p-4 font-bold text-amber-400">{m.riskLevel.toUpperCase()}</td>
                                                <td className="p-4 text-slate-300">{m.macroConclusion}</td>
                                                <td className="p-4 text-slate-300">{m.actionSuggestion}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-900 border-t border-slate-800 py-8 text-center text-slate-400 text-sm">
                        <p>© 2026 Antigravity Real Estate Architecture Terminal. All rights reserved.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
